<!doctype html>
<html lang="es">
  <body style="margin:0; padding:12px; background:#eef3f7; font-family:Arial, Helvetica, sans-serif; color:#163042;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width:560px; background:#ffffff; border:1px solid #d6e0e8; border-radius:16px;">
            <tr>
              <td style="padding:24px 24px 8px;">
                <div style="font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#1567b3;">Max Services · Cotizaciones</div>
                <h1 style="margin:10px 0 8px; font-size:21px; color:#0b1f33;">Hola {{ nombre }}, ya tienes acceso al panel</h1>
                <p style="margin:0; font-size:15px; line-height:1.55;">Ahí aparecen las solicitudes que llegan a contacto@maxservicesspa.cl, las de la web y las de correo.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 24px 24px;">
                <a href="{{ enlace }}" style="display:inline-block; padding:12px 18px; border-radius:10px; background:#1567b3; color:#ffffff; font-weight:700; text-decoration:none;">Elegir mi clave</a>
                <p style="margin:14px 0 0; font-size:13px; color:#5e6a75;">El enlace sirve una sola vez. Después entras siempre por <a href="{{ panel_url }}" style="color:#1567b3;">{{ panel_url }}</a></p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
